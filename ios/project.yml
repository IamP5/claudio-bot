name: ClaudioBot
options:
  bundleIdPrefix: dev.claudiobot
  deploymentTarget:
    iOS: "18.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClaudioBot:
    type: application
    platform: iOS
    sources:
      - path: ClaudioBot
    info:
      path: ClaudioBot/Info.plist
      properties:
        CFBundleDisplayName: ClaudioBot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: ClaudioBot uses the camera to scan the pairing QR code from your Mac and to take photos you send to a bot.
        NSMicrophoneUsageDescription: ClaudioBot listens while you dictate a message to a bot.
        NSSpeechRecognitionUsageDescription: ClaudioBot turns your dictation into text for the message you are writing.
        NSPhotoLibraryUsageDescription: ClaudioBot sends the photos you pick to a bot on your Mac.
        NSLocalNetworkUsageDescription: ClaudioBot connects to the ClaudioBot bridge running on your Mac over your local network or Tailscale.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.claudiobot.app
            CFBundleURLSchemes:
              - claudiobot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.claudiobot.app
        PRODUCT_NAME: ClaudioBot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  ClaudioBotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ClaudioBotTests
      - path: ../fixtures/protocol.json
        buildPhase: resources
        group: ClaudioBotTests
    dependencies:
      - target: ClaudioBot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.claudiobot.app.tests
  ClaudioBotMac:
    type: application
    platform: macOS
    sources:
      # The same app sources as iOS, built into the same module, so the shared code and tests need no `public`.
      - path: ClaudioBot
        excludes:
          - Info.plist
          - Views/PromptTextView.swift
      - path: ClaudioBotMac
    info:
      path: ClaudioBotMac/Info.plist
      properties:
        CFBundleDisplayName: ClaudioBot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        # The repository this build came from, where Install the Bridge runs when no service is installed yet.
        ClaudioBotCheckout: $(CLAUDIOBOT_CHECKOUT)
        NSMicrophoneUsageDescription: ClaudioBot listens while you dictate a message to a bot.
        NSSpeechRecognitionUsageDescription: ClaudioBot turns your dictation into text for the message you are writing.
        NSLocalNetworkUsageDescription: ClaudioBot connects to the ClaudioBot bridge on this Mac or another Mac over your local network or Tailscale.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.claudiobot.mac
            CFBundleURLSchemes:
              - claudiobot
    entitlements:
      path: ClaudioBotMac/ClaudioBotMac.entitlements
      properties:
        com.apple.security.network.client: true
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.claudiobot.mac
        PRODUCT_NAME: ClaudioBot
        PRODUCT_MODULE_NAME: ClaudioBot
        CLAUDIOBOT_CHECKOUT: $(SRCROOT)/..
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Signed to run locally, without a team. Not sandboxed: later builds run launchctl and open local folders.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_PREVIEWS: YES
  ClaudioBotMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClaudioBotTests
        excludes:
          - PromptTextViewTests.swift
      - path: ClaudioBotMacTests
      - path: ../fixtures/protocol.json
        buildPhase: resources
        group: ClaudioBotTests
    dependencies:
      - target: ClaudioBotMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.claudiobot.mac.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ClaudioBot.app/Contents/MacOS/ClaudioBot
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
schemes:
  ClaudioBot:
    build:
      targets:
        ClaudioBot: all
        ClaudioBotTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClaudioBotTests
  ClaudioBotMac:
    build:
      targets:
        ClaudioBotMac: all
        ClaudioBotMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClaudioBotMacTests
