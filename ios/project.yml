name: ClaudioBot
options:
  bundleIdPrefix: dev.claudiobot
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ClaudioBot:
    type: application
    platform: iOS
    sources:
      - path: ClaudioBot
    info:
      path: ClaudioBot/Info.plist
      properties:
        CFBundleDisplayName: ClaudioBot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: ClaudioBot uses the camera to scan the pairing QR code from your Mac and to take photos you send to a bot.
        NSMicrophoneUsageDescription: ClaudioBot listens while you dictate a message to a bot.
        NSSpeechRecognitionUsageDescription: ClaudioBot turns your dictation into text for the message you are writing.
        NSPhotoLibraryUsageDescription: ClaudioBot sends the photos you pick to a bot on your Mac.
        NSLocalNetworkUsageDescription: ClaudioBot connects to the ClaudioBot bridge running on your Mac over your local network or Tailscale.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: dev.claudiobot.app
            CFBundleURLSchemes:
              - claudiobot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.claudiobot.app
        PRODUCT_NAME: ClaudioBot
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  ClaudioBotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ClaudioBotTests
      - path: ../fixtures/protocol.json
        buildPhase: resources
        group: ClaudioBotTests
    dependencies:
      - target: ClaudioBot
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.claudiobot.app.tests
schemes:
  ClaudioBot:
    build:
      targets:
        ClaudioBot: all
        ClaudioBotTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClaudioBotTests
